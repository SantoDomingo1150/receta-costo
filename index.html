<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffffff">
    <title>RecetaCosto - Cálculo de Recetas</title>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #f8f8f8;
            --text-primary: #1a1a1a;
            --text-secondary: #666666;
            --border-color: #e0e0e0;
            --accent: #2563eb;
            --accent-light: #dbeafe;
            --success: #059669;
            --danger: #dc2626;
            --input-bg: #ffffff;
        }

        body.dark-mode {
            --bg-primary: #1a1a1a;
            --bg-secondary: #2d2d2d;
            --text-primary: #f5f5f5;
            --text-secondary: #b0b0b0;
            --border-color: #404040;
            --accent: #3b82f6;
            --accent-light: #1e3a8a;
            --input-bg: #2d2d2d;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            transition: background-color 0.3s, color 0.3s;
            min-height: 100vh;
        }

        header {
            background-color: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent);
            flex: 1;
        }

        .theme-toggle {
            background: none;
            border: 2px solid var(--border-color);
            color: var(--text-primary);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .theme-toggle:hover {
            background-color: var(--bg-primary);
            border-color: var(--accent);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem;
        }

        .nav-tabs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 2rem;
            border-bottom: 1px solid var(--border-color);
            flex-wrap: wrap;
        }

        .nav-tabs button {
            background: none;
            border: none;
            padding: 0.75rem 1.5rem;
            cursor: pointer;
            color: var(--text-secondary);
            border-bottom: 3px solid transparent;
            transition: all 0.2s;
            font-weight: 500;
        }

        .nav-tabs button.active {
            color: var(--accent);
            border-bottom-color: var(--accent);
        }

        .nav-tabs button:hover {
            color: var(--text-primary);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .form-section {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 2rem;
        }

        .form-section h2 {
            margin-bottom: 1.5rem;
            font-size: 1.25rem;
        }

        .form-section h3 {
            margin-bottom: 1rem;
            font-size: 1.1rem;
        }

        .form-group {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        input, select {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background-color: var(--input-bg);
            color: var(--text-primary);
            font-size: 1rem;
            transition: border-color 0.2s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-light);
        }

        .button-group {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        button {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
            font-size: 0.95rem;
        }

        .btn-primary {
            background-color: var(--accent);
            color: white;
        }

        .btn-primary:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            background-color: var(--bg-secondary);
        }

        .btn-danger {
            background-color: var(--danger);
            color: white;
            padding: 0.5rem 1rem;
            font-size: 0.85rem;
        }

        .btn-danger:hover {
            opacity: 0.9;
        }

        .list-item {
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 1rem;
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 1rem;
            align-items: start;
        }

        .list-item-content {
            display: grid;
            gap: 0.5rem;
        }

        .list-item-title {
            font-weight: 600;
            font-size: 1.05rem;
        }

        .list-item-info {
            display: flex;
            gap: 1.5rem;
            flex-wrap: wrap;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .list-item-actions {
            display: flex;
            gap: 0.5rem;
            justify-content: flex-end;
        }

        .empty-state {
            text-align: center;
            padding: 2rem;
            color: var(--text-secondary);
        }

        .ingredient-list {
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 1rem;
        }

        .ingredient-item {
            display: grid;
            grid-template-columns: 1fr 120px 80px 80px auto;
            gap: 0.75rem;
            align-items: center;
            padding: 0.75rem;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.9rem;
        }

        .ingredient-item:last-child {
            border-bottom: none;
        }

        .ingredient-item input {
            padding: 0.5rem;
        }

        .cost-display {
            font-weight: 600;
            color: var(--accent);
        }

        .total-cost {
            font-size: 1.25rem;
            font-weight: 700;
            padding: 1rem;
            background: var(--accent-light);
            border-radius: 8px;
            text-align: right;
            margin-top: 1rem;
        }

        .unit-badge {
            display: inline-block;
            background: var(--accent);
            color: white;
            padding: 0.25rem 0.75rem;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: 500;
        }

        @media (max-width: 768px) {
            .header-content {
                flex-direction: column;
                gap: 0.75rem;
            }

            .logo {
                flex: 1;
                width: 100%;
            }

            .form-group {
                grid-template-columns: 1fr;
            }

            .list-item {
                grid-template-columns: 1fr;
            }

            .ingredient-item {
                grid-template-columns: 1fr;
                gap: 0.5rem;
            }

            .ingredient-item input,
            .ingredient-item select {
                width: 100%;
            }

            .button-group {
                flex-direction: column;
            }

            button {
                width: 100%;
            }

            .nav-tabs {
                gap: 0;
                border-bottom: 1px solid var(--border-color);
            }

            .nav-tabs button {
                flex: 1;
                padding: 0.75rem;
                text-align: center;
                border-bottom-width: 2px;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-content">
            <div class="logo">📋 RecetaCosto</div>
            <button class="theme-toggle" id="themeToggle">🌙 Oscuro</button>
        </div>
    </header>

    <div class="container">
        <div class="nav-tabs">
            <button class="tab-btn active" data-tab="inventario">Inventario</button>
            <button class="tab-btn" data-tab="subrecetas">Sub-recetas</button>
            <button class="tab-btn" data-tab="recetas">Recetas</button>
        </div>

        <!-- TAB: INVENTARIO -->
        <div id="inventario" class="tab-content active">
            <div class="form-section">
                <h2>Agregar Producto</h2>
                <div class="form-group">
                    <div>
                        <label>Nombre del producto</label>
                        <input type="text" id="invNombre" placeholder="Ej: Carne de res">
                    </div>
                    <div>
                        <label>Precio</label>
                        <input type="number" id="invPrecio" placeholder="10000" step="0.01">
                    </div>
                    <div>
                        <label>Unidad base</label>
                        <select id="invUnidad">
                            <option value="kg">kg (kilogramo)</option>
                            <option value="g">g (gramo)</option>
                            <option value="L">L (litro)</option>
                            <option value="ml">ml (mililitro)</option>
                            <option value="cc">cc (centímetro cúbico)</option>
                            <option value="u">u (unidad)</option>
                        </select>
                    </div>
                </div>
                <div class="button-group">
                    <button class="btn-primary" id="btnAddInv">Agregar producto</button>
                </div>
            </div>

            <h2 style="margin-bottom: 1rem; margin-top: 2rem;">Inventario actual</h2>
            <div id="invList"></div>
        </div>

        <!-- TAB: SUB-RECETAS -->
        <div id="subrecetas" class="tab-content">
            <div class="form-section">
                <h2>Crear Sub-receta</h2>
                <div class="form-group">
                    <div>
                        <label>Nombre de la sub-receta</label>
                        <input type="text" id="subNombre" placeholder="Ej: Salsa de ajo">
                    </div>
                    <div>
                        <label>Rendimiento (cantidad producida)</label>
                        <input type="number" id="subRendimiento" placeholder="1000" step="0.1">
                    </div>
                    <div>
                        <label>Unidad del rendimiento</label>
                        <select id="subUnidadRendimiento">
                            <option value="kg">kg</option>
                            <option value="g">g</option>
                            <option value="L">L</option>
                            <option value="ml">ml</option>
                            <option value="cc">cc</option>
                            <option value="u">u</option>
                        </select>
                    </div>
                </div>

                <h3 style="margin-top: 1.5rem; margin-bottom: 1rem;">Ingredientes</h3>
                <div id="subIngredientes" class="ingredient-list">
                    <div class="ingredient-item">
                        <select class="subIngProducto" onchange="updateSubCost()">
                            <option value="">Seleccionar producto...</option>
                        </select>
                        <input type="number" class="subIngCantidad" placeholder="Cantidad" step="0.01" onchange="updateSubCost()">
                        <select class="subIngUnidad" onchange="updateSubCost()">
                            <option value="">Unidad</option>
                        </select>
                        <span style="text-align: right;"></span>
                        <button class="btn-danger" onclick="this.parentElement.remove(); updateSubCost();">✕</button>
                    </div>
                </div>

                <button class="btn-secondary" id="btnAddIngrediente" style="margin-bottom: 1rem;">+ Agregar ingrediente</button>

                <div class="total-cost">
                    Costo total: <span id="subTotalCost">$0</span>
                </div>

                <div class="button-group" style="margin-top: 1rem;">
                    <button class="btn-primary" id="btnSaveSub">Guardar sub-receta</button>
                </div>
            </div>

            <h2 style="margin-bottom: 1rem; margin-top: 2rem;">Sub-recetas guardadas</h2>
            <div id="subList"></div>
        </div>

        <!-- TAB: RECETAS -->
        <div id="recetas" class="tab-content">
            <div class="form-section">
                <h2>Crear Receta</h2>
                <div class="form-group">
                    <div>
                        <label>Nombre del plato</label>
                        <input type="text" id="recNombre" placeholder="Ej: Carne con arroz">
                    </div>
                </div>

                <h3 style="margin-top: 1.5rem; margin-bottom: 1rem;">Ingredientes</h3>
                <div id="recIngredientes" class="ingredient-list">
                    <div class="ingredient-item">
                        <select class="recIngProducto" onchange="updateRecCost()">
                            <option value="">Seleccionar producto...</option>
                        </select>
                        <input type="number" class="recIngCantidad" placeholder="Cantidad" step="0.01" onchange="updateRecCost()">
                        <select class="recIngUnidad" onchange="updateRecCost()">
                            <option value="">Unidad</option>
                        </select>
                        <span style="text-align: right;"></span>
                        <button class="btn-danger" onclick="this.parentElement.remove(); updateRecCost();">✕</button>
                    </div>
                </div>

                <button class="btn-secondary" id="btnAddRecIngrediente" style="margin-bottom: 1rem;">+ Agregar ingrediente</button>

                <div class="total-cost">
                    Costo total del plato: <span id="recTotalCost">$0</span>
                </div>

                <div class="button-group" style="margin-top: 1rem;">
                    <button class="btn-primary" id="btnSaveRec">Guardar receta</button>
                </div>
            </div>

            <h2 style="margin-bottom: 1rem; margin-top: 2rem;">Recetas guardadas</h2>
            <div id="recList"></div>
        </div>
    </div>

    <script>
        // ==================== FIREBASE CONFIG ====================
        const firebaseConfig = {
            apiKey: "AIzaSyD-og1N-hzkK1ZLkU1TLrgQ14dsbC9L7Mw",
            authDomain: "receta-costo.firebaseapp.com",
            projectId: "receta-costo",
            storageBucket: "receta-costo.firebasestorage.app",
            messagingSenderId: "389866178283",
            appId: "1:389866178283:web:6d3f67d516b3139ae6a0ae"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // ==================== DATA MANAGEMENT ====================
        let inventario = [];
        let subrecetas = [];
        let recetas = [];
        let userId = 'default-user';

        // Cargar datos desde Firestore
        async function loadDataFromFirebase() {
            try {
                const invSnapshot = await db.collection('users').doc(userId).collection('inventario').get();
                inventario = invSnapshot.docs.map(doc => ({...doc.data(), id: parseInt(doc.id)}));

                const subSnapshot = await db.collection('users').doc(userId).collection('subrecetas').get();
                subrecetas = subSnapshot.docs.map(doc => ({...doc.data(), id: parseInt(doc.id)}));

                const recSnapshot = await db.collection('users').doc(userId).collection('recetas').get();
                recetas = recSnapshot.docs.map(doc => ({...doc.data(), id: parseInt(doc.id)}));

                renderInventario();
                renderSubrecetas();
                renderRecetas();
                updateSelectOptions();
            } catch (error) {
                console.error('Error cargando datos:', error);
            }
        }

        // Guardar en Firebase
        async function saveToFirebase(collection, data) {
            try {
                const docId = data.id.toString();
                await db.collection('users').doc(userId).collection(collection).doc(docId).set(data);
            } catch (error) {
                console.error('Error guardando en Firebase:', error);
                alert('Error al guardar. Verifica tu conexión a internet.');
            }
        }

        // Eliminar de Firebase
        async function deleteFromFirebase(collection, id) {
            try {
                await db.collection('users').doc(userId).collection(collection).doc(id.toString()).delete();
            } catch (error) {
                console.error('Error eliminando de Firebase:', error);
            }
        }

        // ==================== THEME TOGGLE ====================
        const themeToggle = document.getElementById('themeToggle');
        const isDarkMode = localStorage.getItem('darkMode') === 'true';

        if (isDarkMode) {
            document.body.classList.add('dark-mode');
            themeToggle.textContent = '☀️ Claro';
        }

        themeToggle.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            localStorage.setItem('darkMode', isDark.toString());
            themeToggle.textContent = isDark ? '☀️ Claro' : '🌙 Oscuro';
        });

        // ==================== TAB NAVIGATION ====================
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

                btn.classList.add('active');
                document.getElementById(btn.dataset.tab).classList.add('active');
            });
        });

        // ==================== INVENTARIO ====================
        document.getElementById('btnAddInv').addEventListener('click', async () => {
            const nombre = document.getElementById('invNombre').value;
            const precio = parseFloat(document.getElementById('invPrecio').value);
            const unidad = document.getElementById('invUnidad').value;

            if (!nombre || !precio || !unidad) {
                alert('Por favor completa todos los campos');
                return;
            }

            const producto = { id: Date.now(), nombre, precio, unidad };
            inventario.push(producto);
            await saveToFirebase('inventario', producto);

            document.getElementById('invNombre').value = '';
            document.getElementById('invPrecio').value = '';

            renderInventario();
            updateSelectOptions();
        });

        function renderInventario() {
            const list = document.getElementById('invList');
            if (inventario.length === 0) {
                list.innerHTML = '<div class="empty-state">No hay productos. Agrega el primero.</div>';
                return;
            }

            list.innerHTML = inventario.map(p => `
                <div class="list-item">
                    <div class="list-item-content">
                        <div class="list-item-title">${p.nombre}</div>
                        <div class="list-item-info">
                            <span>$${p.precio.toLocaleString('es-ES')} / ${p.unidad}</span>
                        </div>
                    </div>
                    <div class="list-item-actions">
                        <button class="btn-danger" onclick="deleteInventario(${p.id})">Eliminar</button>
                    </div>
                </div>
            `).join('');
        }

        function deleteInventario(id) {
            inventario = inventario.filter(p => p.id !== id);
            deleteFromFirebase('inventario', id);
            renderInventario();
            updateSelectOptions();
        }

        function updateSelectOptions() {
            const selects = document.querySelectorAll('.subIngProducto, .recIngProducto');
            const options = inventario.map(p => `<option value="${p.id}">${p.nombre}</option>`).join('');

            selects.forEach(select => {
                const current = select.value;
                select.innerHTML = '<option value="">Seleccionar producto...</option>' + options;
                select.value = current;
            });

            const subOptions = subrecetas.map(s => `<option value="SUB_${s.id}">${s.nombre}</option>`).join('');

            document.querySelectorAll('.recIngProducto').forEach(select => {
                const current = select.value;
                select.innerHTML = '<option value="">Seleccionar producto o sub-receta...</option>' + options + subOptions;
                select.value = current;
            });
        }

        // ==================== SUB-RECETAS ====================
        document.getElementById('btnAddIngrediente').addEventListener('click', () => {
            const container = document.getElementById('subIngredientes');
            const newItem = document.createElement('div');
            newItem.className = 'ingredient-item';
            newItem.innerHTML = `
                <select class="subIngProducto" onchange="updateSubCost()">
                    <option value="">Seleccionar producto...</option>
                    ${inventario.map(p => `<option value="${p.id}">${p.nombre}</option>`).join('')}
                </select>
                <input type="number" class="subIngCantidad" placeholder="Cantidad" step="0.01" onchange="updateSubCost()">
                <select class="subIngUnidad" onchange="updateSubCost()">
                    <option value="">Unidad</option>
                </select>
                <span style="text-align: right;"></span>
                <button class="btn-danger" onclick="this.parentElement.remove(); updateSubCost();">✕</button>
            `;
            container.appendChild(newItem);
        });

        function updateSubCost() {
            let totalCost = 0;
            const items = document.querySelectorAll('#subIngredientes .ingredient-item');

            items.forEach(item => {
                const productId = item.querySelector('.subIngProducto').value;
                const cantidad = parseFloat(item.querySelector('.subIngCantidad').value) || 0;
                const unidad = item.querySelector('.subIngUnidad').value;

                if (productId && cantidad && unidad) {
                    const producto = inventario.find(p => p.id == productId);
                    if (producto) {
                        const cost = calculateCost(producto.precio, producto.unidad, cantidad, unidad);
                        totalCost += cost;
                        item.querySelector('span').textContent = `$${cost.toLocaleString('es-ES', {maximumFractionDigits: 2})}`;
                    }
                } else {
                    item.querySelector('span').textContent = '';
                }
            });

            document.getElementById('subTotalCost').textContent = `$${totalCost.toLocaleString('es-ES', {maximumFractionDigits: 2})}`;
        }

        document.getElementById('btnSaveSub').addEventListener('click', async () => {
            const nombre = document.getElementById('subNombre').value;
            const rendimiento = parseFloat(document.getElementById('subRendimiento').value);
            const unidad = document.getElementById('subUnidadRendimiento').value;

            if (!nombre || !rendimiento || !unidad) {
                alert('Por favor completa todos los campos');
                return;
            }

            const ingredientes = [];
            document.querySelectorAll('#subIngredientes .ingredient-item').forEach(item => {
                const productId = item.querySelector('.subIngProducto').value;
                const cantidad = parseFloat(item.querySelector('.subIngCantidad').value);
                const ingredUnidad = item.querySelector('.subIngUnidad').value;

                if (productId && cantidad && ingredUnidad) {
                    ingredientes.push({ productId, cantidad, unidad: ingredUnidad });
                }
            });

            if (ingredientes.length === 0) {
                alert('Agrega al menos un ingrediente');
                return;
            }

            const subreceta = {
                id: Date.now(),
                nombre,
                rendimiento,
                unidad,
                ingredientes
            };

            subrecetas.push(subreceta);
            await saveToFirebase('subrecetas', subreceta);

            document.getElementById('subNombre').value = '';
            document.getElementById('subRendimiento').value = '';
            document.getElementById('subIngredientes').innerHTML = `
                <div class="ingredient-item">
                    <select class="subIngProducto" onchange="updateSubCost()">
                        <option value="">Seleccionar producto...</option>
                    </select>
                    <input type="number" class="subIngCantidad" placeholder="Cantidad" step="0.01" onchange="updateSubCost()">
                    <select class="subIngUnidad" onchange="updateSubCost()">
                        <option value="">Unidad</option>
                    </select>
                    <span style="text-align: right;"></span>
                    <button class="btn-danger" onclick="this.parentElement.remove(); updateSubCost();">✕</button>
                </div>
            `;
            document.getElementById('subTotalCost').textContent = '$0';

            renderSubrecetas();
            updateSelectOptions();
        });

        function renderSubrecetas() {
            const list = document.getElementById('subList');
            if (subrecetas.length === 0) {
                list.innerHTML = '<div class="empty-state">No hay sub-recetas. Crea la primera.</div>';
                return;
            }

            list.innerHTML = subrecetas.map(s => {
                const cost = calculateSubrecetaCost(s);
                const costPerUnit = cost / convertToBaseUnit(s.rendimiento, s.unidad);
                return `
                    <div class="list-item">
                        <div class="list-item-content">
                            <div class="list-item-title">${s.nombre}</div>
                            <div class="list-item-info">
                                <span>Costo total: $${cost.toLocaleString('es-ES', {maximumFractionDigits: 2})}</span>
                                <span>Rendimiento: ${s.rendimiento} ${s.unidad}</span>
                                <span>Costo por unidad: $${costPerUnit.toLocaleString('es-ES', {maximumFractionDigits: 2})} / ${s.unidad}</span>
                            </div>
                        </div>
                        <div class="list-item-actions">
                            <button class="btn-danger" onclick="deleteSubreceta(${s.id})">Eliminar</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function calculateSubrecetaCost(subreceta) {
            let total = 0;
            subreceta.ingredientes.forEach(ing => {
                const producto = inventario.find(p => p.id == ing.productId);
                if (producto) {
                    const cost = calculateCost(producto.precio, producto.unidad, ing.cantidad, ing.unidad);
                    total += cost;
                }
            });
            return total;
        }

        function deleteSubreceta(id) {
            subrecetas = subrecetas.filter(s => s.id !== id);
            deleteFromFirebase('subrecetas', id);
            renderSubrecetas();
            updateSelectOptions();
        }

        // ==================== RECETAS ====================
        document.getElementById('btnAddRecIngrediente').addEventListener('click', () => {
            const container = document.getElementById('recIngredientes');
            const newItem = document.createElement('div');
            newItem.className = 'ingredient-item';
            newItem.innerHTML = `
                <select class="recIngProducto" onchange="updateRecCost()">
                    <option value="">Seleccionar producto o sub-receta...</option>
                    ${inventario.map(p => `<option value="${p.id}">${p.nombre}</option>`).join('')}
                    ${subrecetas.map(s => `<option value="SUB_${s.id}">${s.nombre}</option>`).join('')}
                </select>
                <input type="number" class="recIngCantidad" placeholder="Cantidad" step="0.01" onchange="updateRecCost()">
                <select class="recIngUnidad" onchange="updateRecCost()">
                    <option value="">Unidad</option>
                </select>
                <span style="text-align: right;"></span>
                <button class="btn-danger" onclick="this.parentElement.remove(); updateRecCost();">✕</button>
            `;
            container.appendChild(newItem);
        });

        function updateRecCost() {
            let totalCost = 0;
            const items = document.querySelectorAll('#recIngredientes .ingredient-item');

            items.forEach(item => {
                const id = item.querySelector('.recIngProducto').value;
                const cantidad = parseFloat(item.querySelector('.recIngCantidad').value) || 0;
                const unidad = item.querySelector('.recIngUnidad').value;

                if (id && cantidad && unidad) {
                    let cost = 0;
                    if (id.startsWith('SUB_')) {
                        const subId = parseInt(id.replace('SUB_', ''));
                        const sub = subrecetas.find(s => s.id == subId);
                        if (sub) {
                            const subCost = calculateSubrecetaCost(sub);
                            const baseUnits = convertToBaseUnit(sub.rendimiento, sub.unidad);
                            const costPerUnit = subCost / baseUnits;
                            const inputUnits = convertToBaseUnit(cantidad, unidad);
                            cost = costPerUnit * inputUnits;
                        }
                    } else {
                        const producto = inventario.find(p => p.id == id);
                        if (producto) {
                            cost = calculateCost(producto.precio, producto.unidad, cantidad, unidad);
                        }
                    }
                    totalCost += cost;
                    item.querySelector('span').textContent = `$${cost.toLocaleString('es-ES', {maximumFractionDigits: 2})}`;
                } else {
                    item.querySelector('span').textContent = '';
                }
            });

            document.getElementById('recTotalCost').textContent = `$${totalCost.toLocaleString('es-ES', {maximumFractionDigits: 2})}`;
        }

        document.getElementById('btnSaveRec').addEventListener('click', async () => {
            const nombre = document.getElementById('recNombre').value;

            if (!nombre) {
                alert('Por favor ingresa el nombre del plato');
                return;
            }

            const ingredientes = [];
            document.querySelectorAll('#recIngredientes .ingredient-item').forEach(item => {
                const id = item.querySelector('.recIngProducto').value;
                const cantidad = parseFloat(item.querySelector('.recIngCantidad').value);
                const unidad = item.querySelector('.recIngUnidad').value;

                if (id && cantidad && unidad) {
                    ingredientes.push({ id, cantidad, unidad });
                }
            });

            if (ingredientes.length === 0) {
                alert('Agrega al menos un ingrediente');
                return;
            }

            const receta = {
                id: Date.now(),
                nombre,
                ingredientes
            };

            recetas.push(receta);
            await saveToFirebase('recetas', receta);

            document.getElementById('recNombre').value = '';
            document.getElementById('recIngredientes').innerHTML = `
                <div class="ingredient-item">
                    <select class="recIngProducto" onchange="updateRecCost()">
                        <option value="">Seleccionar producto o sub-receta...</option>
                    </select>
                    <input type="number" class="recIngCantidad" placeholder="Cantidad" step="0.01" onchange="updateRecCost()">
                    <select class="recIngUnidad" onchange="updateRecCost()">
                        <option value="">Unidad</option>
                    </select>
                    <span style="text-align: right;"></span>
                    <button class="btn-danger" onclick="this.parentElement.remove(); updateRecCost();">✕</button>
                </div>
            `;
            document.getElementById('recTotalCost').textContent = '$0';

            renderRecetas();
            updateSelectOptions();
        });

        function renderRecetas() {
            const list = document.getElementById('recList');
            if (recetas.length === 0) {
                list.innerHTML = '<div class="empty-state">No hay recetas. Crea la primera.</div>';
                return;
            }

            list.innerHTML = recetas.map(r => {
                const cost = calculateRecetaCost(r);
                return `
                    <div class="list-item">
                        <div class="list-item-content">
                            <div class="list-item-title">${r.nombre}</div>
                            <div class="list-item-info">
                                <span>Costo total: $${cost.toLocaleString('es-ES', {maximumFractionDigits: 2})}</span>
                            </div>
                        </div>
                        <div class="list-item-actions">
                            <button class="btn-danger" onclick="deleteReceta(${r.id})">Eliminar</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function calculateRecetaCost(receta) {
            let total = 0;
            receta.ingredientes.forEach(ing => {
                if (ing.id.startsWith('SUB_')) {
                    const subId = parseInt(ing.id.replace('SUB_', ''));
                    const sub = subrecetas.find(s => s.id == subId);
                    if (sub) {
                        const subCost = calculateSubrecetaCost(sub);
                        const baseUnits = convertToBaseUnit(sub.rendimiento, sub.unidad);
                        const costPerUnit = subCost / baseUnits;
                        const inputUnits = convertToBaseUnit(ing.cantidad, ing.unidad);
                        total += costPerUnit * inputUnits;
                    }
                } else {
                    const producto = inventario.find(p => p.id == ing.id);
                    if (producto) {
                        const cost = calculateCost(producto.precio, producto.unidad, ing.cantidad, ing.unidad);
                        total += cost;
                    }
                }
            });
            return total;
        }

        function deleteReceta(id) {
            recetas = recetas.filter(r => r.id !== id);
            deleteFromFirebase('recetas', id);
            renderRecetas();
        }

        // ==================== UTILITY FUNCTIONS ====================
        function convertToBaseUnit(cantidad, unidad) {
            const conversions = {
                'kg': 1000, 'g': 1, 'L': 1000, 'ml': 1, 'cc': 1, 'u': 1
            };
            return cantidad * (conversions[unidad] || 1);
        }

        function calculateCost(precio, precioUnidad, cantidad, cantidadUnidad) {
            const precioBaseUnits = convertToBaseUnit(1, precioUnidad);
            const cantidadBaseUnits = convertToBaseUnit(cantidad, cantidadUnidad);
            return (precio / precioBaseUnits) * cantidadBaseUnits;
        }

        // ==================== INITIAL RENDER ====================
        loadDataFromFirebase();
    </script>
</body>
</html>
